<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Idea Library</title>

<!-- PWA / "Add to Home Screen" support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Idea Library">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<!-- Tailwind (CDN build, sufficient for utility classes used here) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Babel standalone, so the browser can transpile JSX directly (no build step needed) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- lucide icons, exposed as a global for our component to destructure from -->
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #12151C; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="idea-library-component.jsx" data-type="module" onload="window.__componentLoaded && window.__componentLoaded()"></script>
<script type="text/babel" data-presets="react">
  // Babel standalone transforms <script type="text/babel"> tags in
  // document order and runs them as soon as each is transformed — but a
  // script loaded via src= is fetched asynchronously, so this inline
  // mounting code could in theory run before idea-library-component.jsx
  // has finished loading and attached window.IdeaLibraryApp. Poll briefly
  // to guarantee correct ordering regardless of network timing.
  function mountWhenReady() {
    if (window.IdeaLibraryApp) {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(window.IdeaLibraryApp));
    } else {
      setTimeout(mountWhenReady, 30);
    }
  }
  mountWhenReady();
</script>
</body>
</html>
