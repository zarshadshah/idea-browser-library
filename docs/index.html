<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Idea Library</title>

<!-- PWA / "Add to Home Screen" support -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Idea Library">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<!-- Tailwind (CDN build, sufficient for utility classes used here) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<!-- Babel standalone, so the browser can transpile JSX directly (no build step needed) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- lucide icons, exposed as a global for our component to destructure from -->
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #12151C; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Load and transpile idea-library-component.jsx manually instead of
  // relying on Babel Standalone's automatic <script type="text/babel"
  // src="..."> handling. A real deployment hit an opaque error inside
  // Babel's own script-loading path ("Cannot use import statement outside
  // a module", traced through Babel's internal transformScriptTags code)
  // even though the source file itself was verified correct and contains
  // no import/export statements at all. Fetching the raw source and
  // transforming it explicitly with Babel.transform() avoids that internal
  // code path entirely and gives us a real, visible error message if
  // something still goes wrong, instead of an opaque internal stack trace.
  fetch('idea-library-component.jsx')
    .then((res) => {
      if (!res.ok) throw new Error(`Failed to fetch component source: ${res.status}`);
      return res.text();
    })
    .then((source) => {
      const transformed = Babel.transform(source, {
        presets: ['react'],
        filename: 'idea-library-component.jsx',
      }).code;
      // Execute the transformed code in global scope so it can attach
      // window.IdeaLibraryApp, then mount it.
      (0, eval)(transformed);
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(window.IdeaLibraryApp));
    })
    .catch((err) => {
      document.getElementById('root').innerHTML =
        '<div style="color: #F7F4EC; font-family: monospace; padding: 20px; white-space: pre-wrap;">' +
        'Failed to load app:\n' + (err && err.message ? err.message : String(err)) +
        '</div>';
      console.error('Idea Library load error:', err);
    });
</script>
</body>
</html>
